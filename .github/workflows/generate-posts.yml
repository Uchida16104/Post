name: Generate posts.json

on:
  push:
    paths:
      - "articles/*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate posts.json
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = 'articles';
          const files = fs.readdirSync(path).filter(f => f.endsWith('.md'));

          const posts = files.map(file => {
            const content = fs.readFileSync(`${path}/${file}`, 'utf8');
            const title =
              content.match(/^#\s+(.+)/m)?.[1] ?? file.replace('.md', '');

            const dateMatch = file.match(/^(\d{4})(\d{2})(\d{2})_/);
            const date = dateMatch
              ? `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`
              : null;

            return {
              slug: file.replace('.md', ''),
              title,
              date,
              url: `https://raw.githubusercontent.com/Uchida16104/Post/main/articles/${file}`
            };
          });

          fs.writeFileSync(
            'posts.json',
            JSON.stringify(posts, null, 2)
          );
          EOF

      - name: Commit posts.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts.json
          git commit -m "Auto-generate posts.json" || exit 0
          git push
