name: Publish to note

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install gray-matter

      - name: Find changed articles
        id: articles
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          CURRENT="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "Current: $CURRENT"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push detected."

            git ls-files \
              | grep -E '^articles/.*\.md$' \
              > changed_articles.txt \
              || true
          else
            git diff \
              --name-only \
              --diff-filter=AM \
              "$BEFORE" \
              "$CURRENT" \
              | grep -E '^articles/.*\.md$' \
              > changed_articles.txt \
              || true
          fi

          echo "Changed article files:"
          cat changed_articles.txt || true

          if [ ! -s changed_articles.txt ]; then
            echo "No article found."
            exit 1
          fi

          echo "count=$(wc -l < changed_articles.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish articles to note
        shell: bash
        env:
          NOTE_SESSION_V5: ${{ secrets.NOTE_SESSION_V5 }}
        run: |
          set -euo pipefail

          while IFS= read -r article; do
            [ -z "$article" ] && continue

            echo "========================================"
            echo "Publishing: $article"
            echo "========================================"

            node scripts/publish-note.js "$article"
          done < changed_articles.txt
