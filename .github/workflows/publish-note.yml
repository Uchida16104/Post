name: Publish to note

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install gray-matter

      - name: Find latest article
        id: article
        shell: bash
        run: |
          set -e

          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Changed files:"

          git diff-tree \
            --no-commit-id \
            --name-only \
            -r \
            "$GITHUB_SHA^" \
            "$GITHUB_SHA" || true

          ARTICLE=$(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$GITHUB_SHA^" \
              "$GITHUB_SHA" \
              | grep -E '^articles/.*\.md$' \
              | tail -n 1 \
              || true
          )

          if [ -z "$ARTICLE" ]; then
            echo "No article found."
            exit 1
          fi

          echo "Article: $ARTICLE"
          echo "path=$ARTICLE" >> "$GITHUB_OUTPUT"

      - name: Publish draft to note
        run: node scripts/publish-note.js "${{ steps.article.outputs.path }}"
        env:
          NOTE_SESSION_V5: ${{ secrets.NOTE_SESSION_V5 }}
