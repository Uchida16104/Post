name: Publish to Qiita

on:
  push:
    branches:
      - main
    paths:
      - "articles/**/*.md"
      - "scripts/publish-qiita.js"
      - ".github/workflows/qiita.yml"

permissions:
  contents: read

jobs:
  qiita:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install gray-matter

      - name: Debug source
        shell: bash
        run: |
          set -euo pipefail

          echo "Git SHA:"
          git rev-parse HEAD

          echo "Recent commits:"
          git log --oneline -5

          echo "publish-qiita.js exists:"
          test -f scripts/publish-qiita.js

      - name: Find changed articles
        id: articles
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          CURRENT="${{ github.sha }}"

          echo "Before: $BEFORE"
          echo "Current: $CURRENT"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push detected."

            git ls-files \
              | grep -E '^articles/.*\.md$' \
              > changed_articles.txt \
              || true
          else
            git diff \
              --name-only \
              --diff-filter=AM \
              "$BEFORE" \
              "$CURRENT" \
              | grep -E '^articles/.*\.md$' \
              > changed_articles.txt \
              || true
          fi

          echo "Changed articles:"
          cat changed_articles.txt || true

          if [ ! -s changed_articles.txt ]; then
            echo "No changed article found."
            exit 1
          fi

          echo "Latest article:"
          tail -n 1 changed_articles.txt

          echo "path=$(tail -n 1 changed_articles.txt)" \
            >> "$GITHUB_OUTPUT"

      - name: Publish to Qiita
        shell: bash
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: |
          set -euo pipefail

          ARTICLE="${{ steps.articles.outputs.path }}"

          echo "========================================"
          echo "Publishing: $ARTICLE"
          echo "========================================"

          node scripts/publish-qiita.js "$ARTICLE"
